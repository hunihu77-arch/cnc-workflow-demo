 const table=(rows,done)=>'<div class="monitorGroup"><h3>'+(done?'검사 완료':'미완료')+' <small>'+rows.length+'건</small></h3><table><thead><tr><th>품목</th><th>수량</th><th>'+(done?'검사 결과':'공정 상태')+'</th><th>납기</th></tr></thead><tbody>'+rows.slice(monitorPage*size,(monitorPage+1)*size).map(o=>'<tr><td title="'+e(o.item)+'">'+e(o.item)+'</td><td>'+o.qty+'</td><td>'+(done?badge('done','합격 '+o.pass+' / 불합격 '+(o.qty-o.pass)):stateBadge(o))+'</td><td>'+(done?e(o.due):badge(...deadline(o)))+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<p>표시할 건이 없습니다.</p>')+'</div>';
 main.innerHTML='<section class="monitor"><div class="bar"><h2>생산 진행 모니터</h2><button data-monitor>관리 화면으로</button></div><div class="metrics"><b>미완료 '+active.length+'건</b><b>납기 주의 '+urgent+'건</b><b>검사 완료 '+finished.length+'건</b></div><div class="monitorGrid">'+table(active,false)+table(finished,true)+'</div><div class="monitorPager"><button data-page="-1" '+(monitorPage===0?'disabled':'')+'>이전</button><span>'+(monitorPage+1)+' / '+pages+'</span><button data-page="1" '+(monitorPage+1===pages?'disabled':'')+'>다음</button></div></section>';return;
 }
 const current=visible.find(o=>o.id===selected)||visible[0];
 if(current)selected=current.id;
 const entry='<div class="entry"><h2>수주 등록</h2><form id="newOrder" novalidate><label>고객사<input name="customer" required></label><label>등록 품목 선택<select id="orderItem" name="registeredItem"><option value="">신규품 직접 입력</option>'+Object.keys(templates).map(x=>'<option value="'+e(x)+'">'+e(x)+'</option>').join('')+'</select></label><label id="newItemName">품목명<input name="item" required></label><label>수주 수량<input name="qty" type="number" min="1" required></label><label>납기<input name="due" type="date" required></label><label>생산 예정일<input name="plan" type="date" required></label><label>소재 규격<input name="material" required></label><label>도면 번호·개정<input name="drawing" required></label><label>공정 순서<input name="route" placeholder="CNC, MCT, 사상, 최종검사" required></label><label>첫 공정 지정 설비<input name="machine" placeholder="공란이면 현장 선택"></label><button class="primary">수주 등록</button><output></output></form></div>';
 const controls=tab===0?Object.entries({all:'전체',draft:'미발행',active:'진행 중',urgent:'납기 주의',done:'완료'}).map(([k,v])=>'<button data-filter="'+k+'" class="'+(filter===k?'active':'')+'">'+v+' '+orders.filter(o=>k==='all'||(k==='active'?!['draft','done'].includes(o.state):k==='urgent'?['late','today','soon'].includes(deadline(o)[0]):o.state===k)).length+'</button>').join(' '):'';
 {
 const rows=tab===3?Object.entries(templates):visible;
 const n=Math.max(1,Math.floor((window.innerHeight-310)/38)), pages=Math.max(1,Math.ceil(rows.length/n));page=Math.min(page,pages-1);
 const panel=tab===3?(opened?master():''):adding?entry:opened&&current?card(current):'';
 main.innerHTML='<div class="erp"><div class="bar"><h2>'+(tab===0?'생산오더 현황':tabs[tab])+'</h2><div>'+(tab===0?controls+' <button data-monitor>모니터링</button> <button class="primary" data-new>수주 등록</button>':tab===3?'<button class="primary" data-master-item="">품목 등록</button>':'')+'</div></div>'+(notice?'<small role="status">'+e(notice)+'</small>':'')+'<section class="grid"><div class="scroll"><table><thead><tr>'+[['수주번호','품목','고객사','예정일','납기','계획량','발행','작업 상태','양품'],['품목','공정','지시 수량','설비','작업자','상태','납기'],['품목','검사 수량','검사자','상태','납기'],['품목','소재','도면·개정','공정 순서','지정 설비']][tab].map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(page*n,(page+1)*n).map(o=>{
 const link=(label)=>'<button data-order="'+o.id+'">'+e(label)+'</button>';
 const due=tab!==3?e(o.due)+' '+(['late','today','soon'].includes(deadline(o)[0])?badge(...deadline(o)):''):'';
 const c=tab===0?[link('SO-'+o.id),e(o.item),e(o.customer),e(o.plan),due,o.qty,o.state==='draft'?'미발행':'발행',stateBadge(o),o.pass??'—']:tab===1?[link(o.item),e(stage(o)),o.qty,e(o.actual||(o.step===0&&o.machine)||'—'),e(o.worker||'—'),stateBadge(o),due]:tab===2?[link(o.item),o.qty,e(o.worker||'—'),stateBadge(o),due]:['<button data-master-item="'+e(o[0])+'">'+e(o[0])+'</button>',e(o[1].material),e(o[1].drawing),e(o[1].route),e(o[1].machine||'현장 선택')];
 return '<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
 }).join('')+'</tbody></table></div><footer>총 '+rows.length+'건 <button data-step="-1" '+(!page?'disabled':'')+'>이전</button> '+(page+1)+' / '+pages+' <button data-step="1" '+(page+1===pages?'disabled':'')+'>다음</button></footer></section></div>'+(panel?'<div class="overlay"><section role="dialog" aria-modal="true" aria-label="수주 정보"><button data-close>닫기</button>'+panel+'</section></div>':'');return;
 }

}
nav.onclick=ev=>{if(ev.target.dataset.tab!==undefined){tab=Number(ev.target.dataset.tab);page=0;monitor=false;opened=false;adding=false;notice='';render()}};
main.onclick=ev=>{
 const b=ev.target;
 const masterButton=b.closest('[data-master-item]');if(masterButton){opened=true;render();const pick=main.querySelector('#pick');pick.value=masterButton.dataset.masterItem;pick.dispatchEvent(new Event('change',{bubbles:true}));return}
 if(b.closest('[data-close]')){adding=opened=false;render();return}
 if(b.dataset.step){page+=Number(b.dataset.step);render();return}
 if(b.closest('[data-monitor]')){monitor=!monitor;monitorPage=0;render();return}
 if(b.closest('[data-new]')){adding=true;notice='';render();return}
 const monitorButton=b.closest('[data-page]');if(monitorButton){monitorPage+=Number(monitorButton.dataset.page);render();return}
 const row=b.closest('[data-order]');if(row){selected=Number(row.dataset.order);opened=true;adding=false;notice='';render();return}
 const item=b.closest('[data-item]')?.dataset.item;
 if(item){const pick=main.querySelector('#pick');pick.value=item;pick.dispatchEvent(new Event('change',{bubbles:true}));pick.focus();return}
 if(b.closest('[data-filter]')){filter=b.closest('[data-filter]').dataset.filter;page=0;render();return}

 const a=b.dataset.action;if(!a)return;
 const el=b.closest('article'),o=orders.find(o=>o.id===Number(el.dataset.id));
 if(a==='sample'){b.form.elements.worker.value=tab===2?'Q01':'W01';if(tab===1)b.form.elements.machine.value=(o.step===0&&o.machine)||equipment[stage(o)][0];return}
 try{change(o,a);save()}catch(err){el.querySelector('output').textContent=err.message}
};
main.onchange=ev=>{
 const f=ev.target.form;
 if(ev.target.id==='orderItem'){
   const item=ev.target.value;
   const t=Object.hasOwn(templates,item)?templates[item]:null;
   f.elements.item.value=item;
   f.elements.item.readOnly=!!t;
   f.querySelector('#newItemName').hidden=!!t;
   for(const k of ['material','drawing','route','machine'])f.elements[k].value=t?.[k]||'';
   if(!t)f.elements.item.focus();
 }
 if(ev.target.id==='pick'){
   const t=templates[ev.target.value];f.elements.item.value=ev.target.value;
   for(const k of ['material','drawing','route','machine'])f.elements[k].value=t?.[k]||'';
   for(const k of ['pdf','photo','stagePhoto'])f.elements[k].value='';
   fillMaster(f);
 }
 if(f?.id==='master'&&ev.target.name==='stage'){f.elements.stagePhoto.value='';fillMaster(f)}
};
main.onsubmit=async ev=>{
 ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f));
 if(f.id==='master'){
   const out=f.querySelector('output');
   try{
     const prior=templates[d.item]?.docs||{};
     const images=['image/png','image/jpeg','image/webp'];
     const [pdf,photo,stagePhoto]=await Promise.all([fileData(d.pdf,['application/pdf']),fileData(d.photo,images),fileData(d.stagePhoto,images)]);
     const docs={pdf:pdf||prior.pdf,photo:photo||prior.photo,notes:{...prior.notes,[d.stage]:d.note},photos:{...prior.photos}};
     if(stagePhoto)docs.photos[d.stage]=stagePhoto;
     const updated={...templates,[d.item]:{material:d.material,drawing:d.drawing,route:d.route,machine:d.machine,docs}};
     localStorage.setItem('cnc-master-v2',JSON.stringify(updated));templates=updated;
     render();main.querySelector('#pick').value=d.item;main.querySelector('#pick').dispatchEvent(new Event('change',{bubbles:true}));main.querySelector('output').textContent='저장 완료';
   }catch(err){out.textContent=err.message||'첨부를 저장할 수 없습니다.'}
   return;
 }
 if(f.id==='newOrder'){
   const out=f.querySelector('output');
   d.item=(d.registeredItem||d.item||'').trim();
   delete d.registeredItem;
   const required={customer:'고객사',item:'품목명',qty:'수주 수량',due:'납기',plan:'생산 예정일',material:'소재 규격',drawing:'도면 번호·개정',route:'공정 순서'};
   const missing=Object.entries(required).filter(([key])=>!d[key]?.trim()).map(([,label])=>label);
   if(missing.length){out.textContent='입력해 주세요 · '+missing.join(', ');return}
   if(!Number.isSafeInteger(Number(d.qty))||Number(d.qty)<1){out.textContent='수주 수량은 1 이상의 정수로 입력해 주세요.';return}
   const s=stages(d);
   if(s.length<2||s.at(-1)!=='최종검사'||s.slice(0,-1).some(x=>!Object.hasOwn(equipment,x))||(d.machine&&!equipment[s[0]]?.includes(d.machine))){f.querySelector('output').textContent='공정과 설비 코드를 확인하세요. 마지막 공정은 최종검사입니다.';return}
   const order={...d,docs:Object.hasOwn(templates,d.item)?templates[d.item].docs:undefined,qty:Number(d.qty),id:Date.now(),step:0,state:'draft',log:[]};
   const updated=[order,...orders];
   try{localStorage.setItem('cnc-demo-v3',JSON.stringify(updated))}
   catch(err){out.textContent='브라우저 저장 공간에 수주를 저장하지 못했습니다.';return}
   orders=updated;filter='all';page=0;opened=false;selected=order.id;adding=false;notice=order.item+' '+order.qty+'개 수주 등록 완료';render();
   return
 }
 const el=f.closest('article'),o=orders.find(o=>o.id===Number(el.dataset.id));
 try{change(o,f.dataset.action,d);if(f.dataset.action==='finish'&&stage(o)==='최종검사'&&o.state==='ready')tab=2;opened=false;save()}catch(err){el.querySelector('output').textContent=err.message}
};
window.addEventListener('resize',()=>{if(monitor||(tab===0&&!adding&&!opened))render()});
render();
</script></html>
